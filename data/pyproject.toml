[project]
name = "smartspend-data"
version = "0.1.0"
description = "Synthetic transactions, receipts and budgets for SmartSpend AI, plus the BigQuery loader"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.1",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
