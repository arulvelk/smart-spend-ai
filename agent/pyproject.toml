[project]
name = "smartspend-agent"
version = "0.1.0"
description = "LangGraph financial advisor agent for SmartSpend AI, reasoning with Gemini on Vertex AI over BigQuery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.30",
    "google-cloud-bigquery>=3.40",
    "langgraph>=1.2",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
