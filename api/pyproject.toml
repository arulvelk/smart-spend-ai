[project]
name = "smartspend-api"
version = "0.1.0"
description = "FastAPI backend for SmartSpend AI on Cloud Run"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "smartspend-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "google-cloud-storage>=2.18",
]

[tool.uv.sources]
smartspend-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
